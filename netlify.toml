# Netlify build configuration.
#
# The Netlify UI's build settings are read from this file, so the fields in the
# dashboard can be left blank — this file is the single source of truth and it
# is version-controlled, which the dashboard is not.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 / TypeScript 6 need a current Node. Netlify's default is older.
  NODE_VERSION = "22"

# Single-page app: every path must serve index.html so client-side routing and
# Supabase auth callback URLs (/auth/callback, /accept-invite/:token) resolve.
# Must stay last — Netlify applies the first matching rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite fingerprints filenames, so hashed assets are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
